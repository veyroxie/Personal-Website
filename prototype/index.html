<title>Ely's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Caveat:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout: one isometric night room fills the stage; objects open OS-style windows over it. Single committed night look. */
:root{
  --night:#0d0b0f; --wallL:#e59ab8; --wallR:#f3b6cc; --wallTrim:#c9ccd4;
  --floor:#1c1a1f; --floor2:#2b2830; --wood:#2e2b33; --wood2:#1d1b21; --wood3:#141216;
  --lamp:#ff9cc4; --accent:#e85d95; --paper:#fbf7ee; --ink:#1c1b25; --mute:#6c6a78; --line:#e6dfd0;
  --display:"Syne",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:#e9e6f2;font-family:var(--body);margin:0;padding-inline:16px;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.name{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.01em}
.name small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:#a9a6bd;letter-spacing:0;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:#a9a6bd}
.pick span{margin-right:4px}
.pick button{width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;cursor:pointer;background:#2b2830;border:2px solid #3a3740;transition:transform .15s,border-color .15s}
.pick button img{width:100%;height:170%;object-fit:cover;object-position:top center}
.pick button:hover,.pick button:focus-visible{transform:translateY(-2px);outline:none;border-color:#c9ccd4}
.pick button[aria-pressed="true"]{border-color:var(--lamp);box-shadow:0 0 0 3px rgba(255,156,196,.25)}
.toggle{font:600 13px var(--body);background:transparent;color:#e9e6f2;border:1px solid #6b6872;border-radius:999px;padding:8px 14px;cursor:pointer}
.toggle:hover,.toggle:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.hint{font-family:var(--mono);font-size:12.5px;color:#a9a6bd;text-align:center}
.hint b{color:var(--lamp);font-weight:500}
.stage{position:relative;width:100%;max-width:100%}
svg#room{display:block;width:100%;height:auto;transition:filter .4s}
svg#room.dark{filter:brightness(.55) saturate(.8)}
.hot{cursor:pointer;outline:none}
.hot:not(.inrange) .pulse{animation:none;opacity:.35;transform:scale(.7)}
.hot .lbl{opacity:0;transition:opacity .2s}
.hot.inrange{filter:drop-shadow(0 0 6px rgba(255,156,196,.9))}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#1c1b25;border:2px solid #e85d95;border-radius:999px;padding:8px 16px;font:500 13px var(--mono);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hot:hover .lbl,.hot:focus-visible .lbl{opacity:1}
.hot:focus-visible .ring{stroke:var(--lamp);stroke-width:3}
@media (hover:none){.hot .lbl{opacity:1}}
.pulse{fill:#fff;stroke:#e85d95;stroke-width:2;animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}
.screen{transition:fill .5s}
.badge{position:absolute;left:10px;top:10px;font:500 11px var(--mono);letter-spacing:.08em;color:#a9a6bd;border:1px dashed #6b6872;border-radius:4px;padding:4px 8px}
/* ---- zoom into the room ---- */
.stage{transition:transform .55s cubic-bezier(.6,0,.3,1),opacity .5s ease-in}
.stage.zoom{transform:scale(3.4);opacity:0}
/* cards used by simple view */
.app{display:flex;flex-direction:column;gap:8px;text-align:left;background:#1c1a1f;border:1px solid #3a3740;border-radius:10px;padding:12px;cursor:pointer;font:inherit;color:#e9e6f2}
.app:hover,.app:focus-visible{border-color:var(--accent);outline:none}
.app img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top left;border-radius:6px}
.app b{font-size:14.5px;line-height:1.3}.app span{font-size:12.5px;color:#a9a6bd}

/* ---- scene shell ---- */
.scene{position:fixed;inset:0;z-index:10;overflow:auto;animation:fade .4s ease-out}
.sbody{min-height:100%;display:grid;place-items:center;padding:64px 16px 24px;box-sizing:border-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.home{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:5;font:600 13px var(--body);background:rgba(13,11,15,.82);color:#fff;border:1px solid #c9ccd4;border-radius:999px;padding:9px 15px;cursor:pointer;backdrop-filter:blur(6px)}
.home:hover,.home:focus-visible{border-color:var(--lamp);color:var(--lamp);outline:none}
.k-monitor{background:#07080e}.k-notes{background:radial-gradient(circle at 50% 25%,#3d2e22,#120d09 75%)}
.k-skills{background:linear-gradient(#e59ab8,#c97a9c)}.k-now{background:radial-gradient(circle at 50% 40%,#f3b6cc,#c97a9c)}
.k-contact{background:radial-gradient(circle at 50% 30%,#3a1f30,#0d0b0f 75%)}

/* ---- monitor: ely-os ---- */
.mon{width:min(1040px,100%);background:#18181f;border-radius:20px;padding:14px 14px 30px;box-shadow:0 0 0 2px #2b2b35,0 40px 140px rgba(255,156,196,.2);position:relative;animation:pop .45s ease-out}
.mon::after{content:"";position:absolute;bottom:11px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#3fdc8a;box-shadow:0 0 8px #3fdc8a}
.scr{position:relative;height:min(620px,72vh);border-radius:10px;overflow:hidden;background:radial-gradient(130% 100% at 85% 110%,#ffb3cf 0%,#e85d95 25%,#5a2346 55%,#0f0b12 88%)}
.boot{position:absolute;inset:0;z-index:4;background:#0a0c16;display:grid;place-content:center;justify-items:center;gap:16px;font:500 14px var(--mono);color:#cfd3ff;transition:opacity .35s}
.boot.gone{opacity:0;pointer-events:none}
.boot .logo{font:700 30px var(--display);color:var(--lamp);letter-spacing:-.01em}
.pb{width:220px;height:4px;background:#262b46;border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--lamp);animation:load .9s ease-in-out forwards}
@keyframes load{to{width:100%}}
.menubar{position:relative;z-index:2;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(8,10,20,.45);backdrop-filter:blur(10px);font:500 12px var(--mono);color:#f1eefa}
.menubar b{font-family:var(--display);font-weight:700;color:var(--lamp)}
.desk{position:absolute;inset:30px 0 84px;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,128px);gap:18px;align-content:start}
.ico{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:#fff;cursor:pointer;font:600 12.5px var(--body);line-height:1.25;text-align:center;padding:10px 6px;border-radius:12px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.14);outline:none}
.tile{width:92px;height:70px;border-radius:12px;background-size:cover;background-position:top left;box-shadow:0 10px 24px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.85);transition:transform .2s}
.ico:hover .tile{transform:translateY(-3px) rotate(-1.5deg)}
.readme{position:absolute;right:22px;top:52px;width:240px;background:rgba(251,247,238,.94);color:var(--ink);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.5;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.readme h4{margin:0 0 6px;font:700 15px var(--display)}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;padding:9px 12px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:20px}
.dock button{width:50px;height:50px;border-radius:14px;border:0;cursor:pointer;display:grid;place-items:center;transition:transform .15s;position:relative}
.dock button:hover,.dock button:focus-visible{transform:translateY(-6px) scale(1.08);outline:none}
.dock button svg{width:26px;height:26px}
.dock button span{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px var(--mono);background:#fbf7ee;color:#1c1b25;padding:3px 7px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s}
.dock button:hover span,.dock button:focus-visible span{opacity:1}
.appwin{position:absolute;z-index:3;inset:44px 4% 84px;background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;animation:pop .28s ease-out}
.wbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#ece5d6;border-bottom:1px solid var(--line);font:500 12.5px var(--mono);color:var(--mute)}
.lights{display:flex;gap:7px}.lights button,.lights i{width:12px;height:12px;border-radius:50%;border:0;padding:0;display:block}
.lights button{background:#ec6a5e;cursor:pointer}.lights i:nth-child(2){background:#f4bf4f}.lights i:nth-child(3){background:#61c554}
.appbody{overflow:auto;padding:22px;display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.appbody img{width:100%;border-radius:8px;border:1px solid var(--line)}
.appbody h2{font:700 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.role{color:var(--mute);font-size:14px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font:500 11.5px var(--mono);background:#efe7d6;border-radius:4px;padding:4px 8px}
.st{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:12px}
.st h4{margin:0 0 3px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--mute)}
.st p{margin:0;font-size:14.5px;line-height:1.55}
@media (max-width:720px){
  .scr{height:auto;min-height:72vh}.desk{position:relative;inset:auto;grid-template-columns:repeat(auto-fill,110px);padding:16px 12px 100px}
  .readme{position:relative;right:auto;top:auto;width:auto;margin:0 12px 100px}
  .appwin{position:fixed;inset:60px 10px 16px}.appbody{grid-template-columns:1fr}
}

/* ---- bookshelf: an open book ---- */
.bookwrap{width:min(1060px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise .5s ease-out}
.book{display:grid;grid-template-columns:1fr 1fr;width:100%;background:#f3ead6;border-radius:6px 6px 8px 8px;box-shadow:0 2px 0 #d9ccb0,0 4px 0 #cdbf9f,0 6px 0 #c0b190,0 36px 90px rgba(0,0,0,.65);position:relative;perspective:1600px}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:60px;margin-left:-30px;background:linear-gradient(90deg,transparent,rgba(80,55,25,.22) 45%,rgba(80,55,25,.3) 50%,rgba(80,55,25,.22) 55%,transparent);pointer-events:none}
.page{padding:34px 34px 46px;font-family:"Newsreader",Georgia,serif;color:#2b2219;position:relative;min-width:0}
.page .num{position:absolute;bottom:16px;font:italic 13px "Newsreader",Georgia,serif;color:#8b7a5e}
.page.l .num{left:34px}.page.r .num{right:34px}
.page.l img{width:100%;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.page .cap{font:italic 14px "Newsreader",Georgia,serif;color:#6e5f45;margin-top:10px}
.kicker{font:600 11px var(--mono);letter-spacing:.14em;color:#9a6b2a;margin:0 0 8px}
.page.r h2{font:italic 500 30px/1.15 "Newsreader",Georgia,serif;margin:0 0 18px;text-wrap:balance}
.page.r h3{font:600 16px "Newsreader",Georgia,serif;margin:18px 0 4px}
.page.r p{font-size:16.5px;line-height:1.6;margin:0;max-width:52ch}
.page.r p.first::first-letter{float:left;font:500 46px/0.9 "Newsreader",Georgia,serif;margin:4px 8px 0 0;color:#9a6b2a}
.turn .page.r{animation:turnR .55s ease-out}.turn .page.l{animation:turnL .55s ease-out}
@keyframes turnR{from{transform:rotateY(-70deg);transform-origin:left;opacity:.2}to{transform:none;opacity:1}}
@keyframes turnL{from{opacity:0}to{opacity:1}}
.booknav{display:flex;gap:12px;align-items:center;font:500 12.5px var(--mono);color:#d8c9ad}
.booknav button{font:600 13px var(--body);background:#f3ead6;color:#2b2219;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.booknav button:disabled{opacity:.35;cursor:default}
@media (max-width:760px){.book{grid-template-columns:1fr}.book::after{display:none}.page{padding:24px 22px 40px}}

/* ---- whiteboard ---- */
.board{width:min(1040px,100%);background:#fcfcf9;border:16px solid #c7cbd3;border-bottom-width:30px;border-radius:10px;box-shadow:inset 0 0 50px rgba(0,0,0,.05),0 34px 90px rgba(0,0,0,.55);padding:30px 34px 26px;position:relative;font-family:"Caveat",cursive;color:#2c2c30;animation:pop .45s ease-out}
.board h2{font:700 50px/1 "Caveat",cursive;margin:0 0 4px;display:inline-block;position:relative}
.board .sub{font-size:24px;color:#6a6a72;margin:0 0 22px}
.underline{position:absolute;left:-4px;right:-8px;bottom:-12px;height:16px;overflow:visible}
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.cl{position:relative}
.cl h3{font:700 36px/1 "Caveat",cursive;margin:0 0 12px;display:inline-block;position:relative;padding:6px 14px}
.cl h3 svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);overflow:visible}
.cl ul{list-style:none;margin:0;padding:0}
.cl li{font-size:27px;line-height:1.35;opacity:0;animation:write .4s ease-out forwards}
.cl li::before{content:"– ";opacity:.6}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tray{position:absolute;bottom:-26px;left:40px;display:flex;gap:14px}
.tray i{width:46px;height:9px;border-radius:5px}
@media (max-width:600px){.board{padding:22px 18px;border-width:10px;border-bottom-width:22px}.board h2{font-size:40px}}

/* ---- sticky note ---- */
.sticky{width:min(480px,100%);min-height:440px;background:linear-gradient(170deg,#ffd3e3,#f7a9c6);transform:rotate(-2.5deg);box-shadow:0 28px 50px rgba(0,0,0,.45),inset 0 -30px 40px rgba(180,40,90,.12);padding:46px 36px 34px;font-family:"Caveat",cursive;color:#3d1427;position:relative;animation:stickIn .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stickIn{from{transform:rotate(-12deg) scale(.6);opacity:0}to{transform:rotate(-2.5deg);opacity:1}}
.sticky::before{content:"";position:absolute;top:-16px;left:50%;width:120px;height:34px;margin-left:-60px;background:rgba(255,255,255,.55);transform:rotate(3deg);box-shadow:0 2px 4px rgba(0,0,0,.1)}
.sticky h2{font:700 44px/1 "Caveat",cursive;margin:0 0 4px}
.sticky .date{font-size:22px;opacity:.7;margin:0 0 20px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.todo li{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:28px;line-height:1.15}
.todo li small{display:block;font-size:21px;opacity:.75}
.box{width:24px;height:24px;border:2.5px solid #3d1427;border-radius:4px;margin-top:4px;display:grid;place-items:center;font-size:24px;line-height:1}

/* ---- phone ---- */
.phone{width:min(370px,100%);height:min(740px,calc(100vh - 100px));background:#0b0c12;border-radius:48px;padding:12px;box-shadow:0 0 0 2px #2b2d3a,0 40px 100px rgba(0,0,0,.7);animation:rise .55s cubic-bezier(.2,1,.3,1);position:relative}
.pscreen{height:100%;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(170deg,#141016 0%,#4a2238 55%,#d26a95 100%);color:#fff}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font:600 13px var(--body)}
.notch{width:96px;height:26px;background:#0b0c12;border-radius:20px}
.chathead{display:flex;align-items:center;gap:12px;padding:10px 18px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f7f7fa,#c9ccd4);display:grid;place-items:center;font:700 15px var(--display);color:#1c1b25}
.chathead b{font-size:15.5px;display:block}.chathead small{font-size:12px;color:#9fe0b5}
.msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;background:rgba(255,255,255,.95);color:#1c1b25;padding:10px 13px;border-radius:18px 18px 18px 6px;font-size:14.5px;line-height:1.4;animation:rise .3s ease-out}
.typing{display:flex;gap:4px;padding:12px 14px;background:rgba(255,255,255,.9);border-radius:18px;width:max-content}
.typing i{width:7px;height:7px;border-radius:50%;background:#8a8796;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.ccard{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;animation:rise .3s ease-out}
.ccard small{display:block;font:500 11px var(--mono);letter-spacing:.08em;color:#c9c4dc}
.ccard code{font:500 13px var(--mono);color:#ffc2d8;user-select:all;word-break:break-all}
.ccard button{font:600 12px var(--body);background:#fff;color:#1c1b25;border:0;border-radius:999px;padding:6px 11px;cursor:pointer;flex:none}
.inputbar{margin:8px 12px 14px;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13.5px;color:#c9c4dc}
@media (prefers-reduced-motion:reduce){.stage{transition:none}.scene,.mon,.appwin,.bookwrap,.board,.sticky,.phone,.bub,.ccard,.cl li,.turn .page{animation:none!important}.cl li{opacity:1}.draw{animation:none;stroke-dashoffset:0}}

/* simple view */
.simple{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.simple .app{background:#1d2236;border-color:#3a4366;color:#e9e6f2}.simple .app span{color:#a9a6bd}
@media (prefers-reduced-motion:reduce){.pulse,.win{animation:none}.screen{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="name">Ely Tee<small>AI agents · data pipelines · custom web apps</small></div>
    <div class="hdr-r"><div class="pick" role="group" aria-label="Choose your character"><span>Play as</span><button type="button" data-c="0" aria-label="Character 1" aria-pressed="false"><img src="chibi-short.png" alt=""></button><button type="button" data-c="1" aria-label="Character 2" aria-pressed="false"><img src="chibi-long.png" alt=""></button><button type="button" data-c="2" aria-label="Character 3" aria-pressed="false"><img src="chibi-boy.png" alt=""></button></div><button class="toggle" id="viewToggle" type="button">Skip to simple view</button></div>
  </header>

  <div class="stage" id="stage">
    <span class="badge">PROTOTYPE</span>
    <svg id="room" viewBox="60 20 880 740" role="img" aria-label="An isometric bedroom at night with a desk, monitor, phone, bookshelf and whiteboard you can click"></svg>
  </div>
  <p class="hint" id="hint">Walk around with <b>arrow keys</b> or <b>WASD</b>, or tap the floor. Walk up to something until it glows, then press <b>E</b> or tap its bubble.</p>

  <div class="simple" id="simple" hidden></div>
</div>

<div class="scene" id="scene" hidden role="dialog" aria-modal="true" aria-label="Opened object"><button class="home" id="closeBtn" type="button">← Back to the room</button><div class="sbody" id="sceneBody"></div></div>

<script>
const PROJECTS=[
 {id:'agent',img:'agent.png',title:'Agentic AI Assistant for Live IoT Building Data',role:'AI Engineer, lead developer',tags:['LangGraph','MCP','RAG','FastAPI','GraphQL','ClickHouse'],
  text:['Facility managers needed answers from thousands of live sensor readings without writing queries.','I built an agent that picks typed tools (sensor discovery, time-series aggregation, peak demand), calls a GraphQL backend over ClickHouse and returns structured reports. RAG adds domain context.','Shipped to commercial building clients.']},
 {id:'pipeline',img:'pipeline.png',title:'Energy Meter Data Reconstruction Pipeline',role:'Data Engineer',tags:['Python','pandas','NumPy','asyncio','Athena','S3','ClickHouse'],

   ${['THE PROBLEM','WHAT I BUILT','RESULT'].map((h,j)=>p.text[j]?`<div class="st"><h4>${h}</h4><p>${esc(p.text[j])}</p></div>`:'').join('')}</div></div>`;
  scr.appendChild(w); w.querySelector('.lights button').focus();
  w.querySelector('.lights button').onclick=()=>{w.remove();scr.querySelector(`[data-p="${id}"]`).focus()};
}

/* hotspots */
const KIND={projects:'monitor',notes:'notes',skills:'skills',now:'now',contact:'contact'};
let lampOn=true;
function toggleLamp(){
  lampOn=!lampOn; glow.style.display=lampOn?'':'none';
  bulb.setAttribute('fill',lampOn?'#ffe3ee':'#6b6a75');
  svg.classList.toggle('dark',!lampOn); lampG.setAttribute('aria-checked',String(lampOn));
}
const tryUse=k=>{const sp=SPOTS.find(x=>x.k===k);if(nearSpot&&nearSpot.k===k){useSpot(sp);return}
  toast('Walk closer to use the '+sp.label.toLowerCase());walkTo(sp)};
lampG.addEventListener('click',()=>tryUse('lamp'));
lampG.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tryUse('lamp')}});
const toastEl=document.createElement('div');toastEl.className='toast';toastEl.setAttribute('role','status');stageEl.appendChild(toastEl);
let toastT;function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1800)}
svg.querySelectorAll('.hot[data-open]').forEach(h=>{
  const go=()=>tryUse(h.dataset.open);
  h.addEventListener('click',go);
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
});
closeBtn.onclick=closeScene;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!scene.hidden){const w=document.querySelector('.appwin');if(w){w.remove()}else closeScene()}});

/* simple view */
const simple=document.getElementById('simple'),hint=document.getElementById('hint'),tog=document.getElementById('viewToggle');
simple.innerHTML=PROJECTS.map(p=>`<button class="app" data-p="${p.id}" type="button"><img src="${p.img}" alt=""><b>${esc(p.title)}</b><span>${esc(p.role)}</span></button>`).join('')+
 [['notes','How I think','The decisions behind the diagrams'],['skills','Skills','AI, data and web stack'],['now','Working on now','What I\'m doing this month'],['contact','Contact','Email, Upwork, LinkedIn']].map(([k,t,s])=>`<button class="app" data-k="${k}" type="button"><b>${t}</b><span>${s}</span></button>`).join('');
simple.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{openScene('monitor',null);later(()=>openApp(b.dataset.p),RM?0:1050)});
simple.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openScene(b.dataset.k,null));
let isSimple=false;
tog.onclick=()=>{isSimple=!isSimple;simple.hidden=!isSimple;stageEl.hidden=isSimple;hint.hidden=isSimple;tog.textContent=isSimple?'Back to the room':'Skip to simple view'};

/* ---------- walking character ---------- */
// Walkable floor stays in front of every piece of furniture, so she always draws on top correctly.
const WALK={x0:62,x1:405,y0:108,y1:405};
const SPOTS=[ // where she stands for each object, and the zone that counts as "near"
 {k:'projects',label:'Projects',x:245,y:118,near:p=>p.y<150&&p.x>=205&&p.x<295},
 {k:'contact',label:'Phone',x:180,y:118,near:p=>p.y<150&&p.x>=150&&p.x<205},
 {k:'now',label:'Sticky note',x:150,y:118,near:p=>p.y<150&&p.x>=118&&p.x<150},
 {k:'lamp',label:'Lamp',x:322,y:118,near:p=>p.y<150&&p.x>=295&&p.x<360},
 {k:'skills',label:'Whiteboard',x:72,y:118,near:p=>p.x<118&&p.y<160},
 {k:'notes',label:'Bookshelf',x:72,y:235,near:p=>p.x<110&&p.y>=170&&p.y<=305}
];
const me={x:250,y:260,face:1,walking:false,target:null,onArrive:null};
const av=el('g',{id:'avatar','aria-hidden':'true'});
el('ellipse',{cx:0,cy:0,rx:20,ry:7,fill:'rgba(0,0,0,.4)'},av);
const avBody=el('g',{},av);
const CHARS=[{src:'chibi-short.png',w:160},{src:'chibi-long.png',w:167},{src:'chibi-boy.png',w:187}];
const AVH=112;
const avImg=el('image',{},avBody);
function setChar(i){
  const c=CHARS[i]||CHARS[0],w=AVH*c.w/360;
  avImg.setAttribute('href',c.src);avImg.setAttribute('x',(-w/2).toFixed(1));avImg.setAttribute('y',-AVH);
  avImg.setAttribute('width',w.toFixed(1));avImg.setAttribute('height',AVH);
  document.querySelectorAll('.pick button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
  try{localStorage.setItem('ely-room-char',String(i))}catch(_){}
}
// prompt bubble
const prompt=el('g',{id:'prompt',class:'prompt',role:'button',tabindex:0,style:'display:none;cursor:pointer'});
const pr=el('rect',{x:0,y:0,width:10,height:26,rx:13,fill:'#fff',stroke:'#e85d95','stroke-width':2},prompt);
const pt=el('text',{x:0,y:17.5,'text-anchor':'middle','font-family':'JetBrains Mono, monospace','font-size':12,fill:'#1c1b25'},prompt);

let nearSpot=null;
function place(){
  const [sx,sy]=P(me.x,me.y,0);
  av.setAttribute('transform',`translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
  const bob=me.walking?Math.sin(performance.now()/90)*2:0;
  const tilt=me.walking?Math.sin(performance.now()/90)*4:0;
  avBody.setAttribute('transform',`translate(0,${(-Math.abs(bob)*1.6).toFixed(2)}) rotate(${tilt.toFixed(2)}) scale(${-me.face},1)`);
  
  nearSpot=SPOTS.find(s=>s.near(me))||null;
  const nk=nearSpot&&!me.target?nearSpot.k:null;
  svg.querySelectorAll('.hot').forEach(g=>g.classList.toggle('inrange',(g.dataset.open||(g.dataset.lamp?'lamp':''))===nk));
  if(nearSpot&&!me.target){
    const coarse=matchMedia('(hover:none)').matches;
    const txt=(coarse?'Tap: ':'E: ')+nearSpot.label;
    pt.textContent=txt;const w=txt.length*7.4+24;
    pr.setAttribute('width',w);pr.setAttribute('x',sx-w/2);pr.setAttribute('y',sy-AVH-34);
    pt.setAttribute('x',sx);pt.setAttribute('y',sy-AVH-16.5);
    prompt.style.display='';prompt.setAttribute('aria-label','Open '+nearSpot.label);
  } else prompt.style.display='none';
}
const clampW=p=>({x:Math.min(WALK.x1,Math.max(WALK.x0,p.x)),y:Math.min(WALK.y1,Math.max(WALK.y0,p.y))});
function walkTo(p,cb){
  if(RM){Object.assign(me,clampW(p));me.target=null;place();cb&&cb();return}
  me.target=clampW(p);me.onArrive=cb||null;
}
function useSpot(s){
  if(!s)return;
  if(s.k==='lamp'){toggleLamp();return}
  const hot=svg.querySelector(`.hot[data-open="${s.k}"]`);
  const k=KIND[s.k]; if(k==='monitor')screen.setAttribute('fill','url(#scr)');
  openScene(k,hot);
}
prompt.addEventListener('click',e=>{e.stopPropagation();useSpot(nearSpot)});
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();useSpot(nearSpot)}});

// keyboard: arrows/WASD move in screen directions, E opens
const keys=new Set();
const KM={ArrowUp:[-1,-1],w:[-1,-1],ArrowDown:[1,1],s:[1,1],ArrowLeft:[-1,1],a:[-1,1],ArrowRight:[1,-1],d:[1,-1]};
const roomActive=()=>scene.hidden&&!stageEl.hidden;
document.addEventListener('keydown',e=>{
  if(!roomActive()||e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KM[k]){keys.add(k);me.target=null;e.preventDefault()}
  else if(k==='e'&&nearSpot){useSpot(nearSpot)}
});
document.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k)});
window.addEventListener('blur',()=>keys.clear());

// tap or click the floor to walk there
svg.addEventListener('click',e=>{
  if(e.target.closest('.hot')||e.target.closest('#prompt'))return;
  const pt0=svg.createSVGPoint();pt0.x=e.clientX;pt0.y=e.clientY;
  const q=pt0.matrixTransform(svg.getScreenCTM().inverse());
  const a=(q.x-O.x)/0.866,b=(q.y-O.y)/0.5; // a=x-y, b=x+y on the floor
  const x=(a+b)/2,y=(b-a)/2;
  if(x<0||y<0||x>W||y>W)return;
  walkTo({x,y});
});

let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let dx=0,dy=0;
  keys.forEach(k=>{dx+=KM[k][0];dy+=KM[k][1]});
  const speed=150;
  if(dx||dy){
    const n=Math.hypot(dx,dy);const nx=clampW({x:me.x+dx/n*speed*dt,y:me.y+dy/n*speed*dt});
    if(dx-dy) me.face=(dx-dy)>0?1:-1;
    me.x=nx.x;me.y=nx.y;me.walking=true;
  } else if(me.target){
    const vx=me.target.x-me.x,vy=me.target.y-me.y,d=Math.hypot(vx,vy);
    if(d<3){me.x=me.target.x;me.y=me.target.y;me.target=null;me.walking=false;const cb=me.onArrive;me.onArrive=null;place();cb&&cb()}
    else{const s=Math.min(d,speed*1.3*dt);me.x+=vx/d*s;me.y+=vy/d*s;if(Math.abs(vx-vy)>1)me.face=(vx-vy)>0?1:-1;me.walking=true}
  } else me.walking=false;
  place();
  requestAnimationFrame(tick);
}
place();requestAnimationFrame(tick);

document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>setChar(+b.dataset.c));
let startChar=0;try{const v=localStorage.getItem('ely-room-char');if(v!==null&&CHARS[+v])startChar=+v}catch(_){}
setChar(startChar);
</script>
